name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Publish as official GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: false
        type: string
        default: 'v1.2.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: 🧪 Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --continue
          else
            gradle testDebugUnitTest --continue
          fi

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  build-debug:
    name: 📦 Assemble Debug APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labcast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-and-publish-release:
    name: 🚀 Build & GitHub Release
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release APK Package
        id: prepare_apk
        run: |
          mkdir -p release_dist
          # Find generated APK file
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*unaligned*" 2>/dev/null | head -n 1)

          if [ -n "$APK_FILE" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
            if [ -z "$TAG_NAME" ]; then
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                TAG_NAME="${{ github.ref_name }}"
              else
                VER_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1 | tr -d ' ')
                if [ -z "$VER_NAME" ]; then VER_NAME="1.2"; fi
                TAG_NAME="v${VER_NAME}"
              fi
            fi

            TARGET_NAME="LabCast-${TAG_NAME}.apk"
            cp "$APK_FILE" "release_dist/${TARGET_NAME}"
            cd release_dist
            sha256sum "${TARGET_NAME}" > "${TARGET_NAME}.sha256"
            echo "apk_path=release_dist/${TARGET_NAME}" >> $GITHUB_OUTPUT
            echo "checksum_path=release_dist/${TARGET_NAME}.sha256" >> $GITHUB_OUTPUT
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "Successfully prepared APK: release_dist/${TARGET_NAME}"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name || 'v1.2.0' }}
          name: "LabCast ${{ steps.prepare_apk.outputs.tag_name || 'v1.2.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            release_dist/*.apk
            release_dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
